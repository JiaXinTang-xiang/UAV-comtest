mission:
  cruise_altitude: 2.5
  altitude_tolerance: 0.10
  position_tolerance: 0.35
  max_mission_seconds: 180.0
  max_xy_speed: 0.5
  control_rate_hz: 20.0
  frame_id: map
  # Gazebo world x is mirrored around x=5 to match the public map on screen.
  takeoff: [5.0, 9.0]
  areas:
    area_2: [6.0, 7.0]
    area_3: [5.0, 5.0]
    area_4: [2.0, 3.0]
    area_5: [4.0, 1.0]
  landing_target: [7.0, 1.0]
  route:
    right: [[5.0, 9.0], [6.0, 7.0], [5.0, 5.0], [2.0, 3.0], [4.0, 1.0], [6.0, 1.0], [7.0, 1.0]]
    left: [[5.0, 9.0], [7.2, 9.0], [7.2, 7.0], [7.2, 5.0], [9.48, 5.0], [9.48, 3.0], [9.48, 1.0], [7.0, 1.0]]
  selected_route: right
frames:
  # Task coordinates -> Gazebo world. Angles are radians; default map is ENU.
  map_origin_world: [0.0, 0.0, 0.0]
  map_yaw_world: 0.0
  px4_enu_yaw_world: 0.0
  lidar_pose_body: [0.0, 0.0, 0.0]
map:
  bounds: [0.0, 10.0, 0.0, 10.0]
  model_paths: []
trajectory:
  enabled: true
  corner_radius: 0.30
  sample_spacing: 0.05
  lookahead: 0.20
  max_xy_acceleration: 0.35
  corner_speed: 0.15
safety:
  bounds: [0.25, 9.75, 0.25, 9.75]
  min_altitude: 0.15
  max_altitude: 3.2
  obstacle_stop_distance: 0.65
  stale_sensor_seconds: 0.5
  action_on_violation: land
training_assumptions:
  wall_height: 3.0
  wall_thickness: 0.15
  official_wall_height_known: false
  optical_flow_is_proxy: false
# Planning uses the actual collision boxes in competition_course.world.
planner:
  clearance: 0.70
  resolution: 0.10
  # Allow transient lidar memory (12 s) to refresh before aborting.
  replan_wait_seconds: 15.0
  replan_retry_seconds: 1.0
  # Gazebo/PX4 tracking can leave a small steady-state offset near walls.
  waypoint_tolerance: 0.18
  lidar_stop_distance: 0.48
  # Emergency landing is reserved for a persistent, extremely close return.
  # The larger lidar_stop_distance is used for replanning/slowdown decisions.
  emergency_landing_distance: 0.20
  emergency_sector_half_angle_deg: 45.0
  corridor_limit: 0.40
# Training coordinates use the approved mirrored Gazebo world, not image x.
# Left-side labels refer to the red route in the original map image.
route_profiles:
  right:
    clearance: 0.70
    max_xy_speed: 0.50
    corridor_limit: 0.40
    targets:
      AREA_2: [6.0, 7.0]
      AREA_3: [5.0, 5.0]
      AREA_4: [2.0, 3.0]
      AREA_5: [4.0, 1.0]
  left:
    # The red route uses the narrow outer corridor in the training map.
    # Keep a practical margin for the simulated Iris while allowing tracking
    # error in the narrow outer corridor. Geofence and emergency distance
    # protections remain active globally.
    clearance: 0.25
    max_xy_speed: 0.25
    corridor_limit: 0.45
    targets:
      TRANSIT_1: [7.2, 9.0]
      AREA_2: [7.2, 7.0]
      AREA_3: [7.2, 5.0]
      TRANSIT_3: [9.48, 5.0]
      AREA_4: [9.48, 3.0]
      AREA_5: [9.48, 1.0]
